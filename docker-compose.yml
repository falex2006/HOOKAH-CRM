services:
  crm:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      VENUE_ID: ${VENUE_ID:-00000000-0000-0000-0000-000000000001}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Yekaterinburg}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-change_me_admin}
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-change_me_owner}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-change_me_staff}
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:-change_me}@db:5432/crm
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - crm
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:


