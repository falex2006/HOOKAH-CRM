name: CRM contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Design contract
        run: node scripts/local-design-contract.mjs
      - name: Static boundary contract
        run: node scripts/local-static-boundary.mjs
      - name: Deployment contract
        run: node scripts/local-deploy-contract.mjs
      - name: Start local CRM for API contracts
        run: |
          PORT=3000 HOST=127.0.0.1 AUTH_REQUIRED=false node server.js >/tmp/hookah-crm.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hookah-crm.log
          exit 1
      - name: Role contract
        run: node scripts/local-role-contract.mjs
      - name: Insights contract
        run: node scripts/local-insights-contract.mjs
      - name: Date contract
        run: node scripts/local-date-contract.mjs
      - name: Login contract
        run: node scripts/local-login-contract.mjs
      - name: Validate shell scripts
        run: |
          bash -n deploy-vps.sh
          bash -n migrate-vps.sh
          bash -n backup-postgres.sh
          bash -n verify-backup.sh
          bash -n post-deploy-acceptance.sh
      - name: Dependency audit and package check
        run: |
          npm audit --omit=dev --audit-level=high
          npm pack --dry-run

  postgres-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Initialize PostgreSQL schema and seed
        env:
          PGPASSWORD: crm-ci-password
        run: |
          psql --host 127.0.0.1 --username crm --dbname crm --file schema.sql
          psql --host 127.0.0.1 --username crm --dbname crm --file seed.sql
          DATABASE_URL=postgresql://crm:crm-ci-password@127.0.0.1:5432/crm node scripts/migrate.js
      - name: Create persisted order
        env:
          DATABASE_URL: postgresql://crm:crm-ci-password@127.0.0.1:5432/crm
          PORT: 3000
          HOST: 127.0.0.1
          AUTH_REQUIRED: false
        run: |
          node server.js >/tmp/hookah-crm-postgres.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          ORDER_ID=$(BASE_URL=http://127.0.0.1:3000 MODE=create node scripts/local-postgres-contract.mjs)
          echo "ORDER_ID=$ORDER_ID" >> "$GITHUB_ENV"
          pkill -f "node server.js" || true
      - name: Restart CRM and verify persisted order
        env:
          DATABASE_URL: postgresql://crm:crm-ci-password@127.0.0.1:5432/crm
          PORT: 3000
          HOST: 127.0.0.1
          AUTH_REQUIRED: false
        run: |
          node server.js >/tmp/hookah-crm-postgres-restart.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 MODE=verify ORDER_ID="$ORDER_ID" node scripts/local-postgres-contract.mjs
