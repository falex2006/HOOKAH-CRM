<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Территория — Вход</title><link rel="stylesheet" href="/style.css?rev=202"></head>
<body><div class="login"><div class="login-atmosphere" aria-hidden="true"><div class="login-smoke smoke-back"></div><div class="login-smoke smoke-mid"></div><div class="login-smoke smoke-front"></div><div class="login-hookah"><div class="login-hookah__bowl"><span class="login-hookah__tobacco"></span><span class="login-hookah__metal"></span><span class="login-hookah__coal coal-1"></span><span class="login-hookah__coal coal-2"></span><span class="login-hookah__coal coal-3"></span></div><div class="login-hookah__stem"></div><div class="login-hookah__tray"></div><div class="login-hookah__base"></div></div></div><form class="login-card" id="login-form" hidden autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-bwignore="true"><div class="brand-mark" data-login-brand aria-label="Логотип заведения">T</div><p class="login-kicker">TERRITORY CRM</p><h1>Добро пожаловать</h1><p>Рабочее пространство кальян-бара</p><label>Логин<input id="login-username" name="login_id" autocomplete="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" placeholder="Введите логин" required></label><label class="login-password-field">Пароль<div class="login-password-wrap"><input id="login-password" name="login_secret" type="password" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" placeholder="Введите пароль" required><button id="login-password-toggle" class="login-password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false">Показать</button></div></label><button class="primary" type="submit">Войти в систему</button><p id="login-message" class="login-message"></p></form><form class="login-card setup-card" id="setup-form" autocomplete="off" data-form-type="other"><div class="brand-mark" aria-hidden="true">T</div><p class="login-kicker">ПЕРВЫЙ ЗАПУСК</p><h1>Настройте заведение</h1><p>Создайте свою учётную запись администратора и начните с чистого пространства.</p><label>Название заведения<input id="setup-venue" autocomplete="off" required placeholder="Например, Территория"></label><label>Ваше имя<input id="setup-name" autocomplete="off" required placeholder="Имя владельца"></label><label>Город<input id="setup-city" autocomplete="off" placeholder="Город"></label><label>Логин<input id="setup-login" type="email" autocomplete="off" autocapitalize="none" required placeholder="admin@example.ru"></label><label>Пароль<div class="login-password-wrap"><input id="setup-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Не менее 8 символов"><button id="setup-password-toggle" class="login-password-toggle" type="button">Показать</button></div></label><label>Часовой пояс<select id="setup-timezone"><option value="Asia/Yekaterinburg">Екатеринбург (UTC+5)</option><option value="Europe/Moscow">Москва (UTC+3)</option><option value="Asia/Novosibirsk">Новосибирск (UTC+7)</option><option value="Asia/Vladivostok">Владивосток (UTC+10)</option><option value="Asia/Krasnoyarsk">Красноярск (UTC+7)</option></select></label><button class="primary" type="submit">Создать и войти</button><p id="setup-message" class="login-message"></p></form></div><script src="login.js?rev=88"></script></body></html>
